name: Bug report
description: Something in the app or the CLI doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Please fill in every field so it can be reproduced.
  - type: input
    id: version
    attributes:
      label: Nommo Control version
      description: Shown in Finder under Get Info for the app, or by `nommo --version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: speaker
    attributes:
      label: Speaker model
      options:
        - Nommo V2
        - Other
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Where does it happen?
      options:
        - App
        - CLI
        - Both
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the speaker over USB
        2. Open the panel
        3. …
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `nommo status`
      description: Optional, but helpful if the CLI is installed.
      render: text
